<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Hub Personal</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Barra de pestañas superior */
        header {
            background-color: #1e293b;
            display: flex;
            justify-content: center;
            padding: 10px;
            gap: 10px;
            border-bottom: 1px solid #334155;
        }
        .tab-btn {
            background-color: #334155;
            color: #cbd5e1;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .tab-btn.active {
            background-color: #3b82f6;
            color: #ffffff;
        }
        .tab-btn:hover {
            background-color: #475569;
        }
        /* Contenedor de las vistas */
        .content-container {
            flex: 1;
            position: relative;
            width: 100%;
        }
        .tab-content {
            display: none;
            width: 100%;
            height: 100%;
        }
        .tab-content.active {
            display: block;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <button class="tab-btn active" onclick="switchTab(event, 'instagram')">Instagram</button>
        <button class="tab-btn" onclick="switchTab(event, 'youtube')">YouTube</button>
        <button class="tab-btn" onclick="switchTab(event, 'x')">X (Twitter)</button>
    </header>

    <div class="content-container">
        <!-- Pestaña de Instagram -->
        <div id="instagram" class="tab-content active">
            <iframe src="https://www.instagram.com"></iframe>
        </div>
        <!-- Pestaña de YouTube -->
        <div id="youtube" class="tab-content">
            <iframe src="https://www.youtube.com"></iframe>
        </div>
        <!-- Pestaña de X -->
        <div id="x" class="tab-content">
            <iframe src="https://twitter.com"></iframe>
        </div>
    </div>

    <script>
        function switchTab(evt, tabName) {
            // Ocultar todos los contenidos
            const contents = document.querySelectorAll('.tab-content');
            contents.forEach(content => content.classList.remove('active'));

            // Desactivar todos los botones
            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach(btn => btn.classList.remove('active'));

            // Activar la pestaña y el botón actual
            document.getElementById(tabName).classList.add('active');
            evt.currentTarget.classList.add('active');
        }
    </script>

</body>
</html>
